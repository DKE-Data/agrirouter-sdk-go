openapi: "3.1.0"

info:
  contact:
    email: info@dke-data.com
    name: DKE Data
    url: https://dke-data.com
  title: agrirouter G4 API
  version: "1.0"
  description: |
    This service provides access to agrirouter API through modern RESTful interface called G4 (for gateway id = 4).
servers:
  - url: http://localhost:{port}
    variables:
      port:
        default: "8081"
  - url: https://api.qa.agrirouter.farm
    description: QA Server
  - url: https://api.agrirouter.com
    description: Production Server

tags:
  - name: Masterdata
    description: >
      Synchronizing organizations, persons, farms, fields, and field
      boundaries with agrirouter (AgmaSync).

paths:
  /messages:
    post:
      operationId: sendMessages
      summary: Send one or several messages to agrirouter inbox
      description: |
        Send one or several messages via agrirouter to other endpoints.
        The payload is sent as a binary stream in the request body.
        If the payload is too large, it would be split into several messages
        by agrirouter itself, client does not need to care about doing that.
        Depending on size of the payload, result could be a single message
        or several messages in the target endpoint outboxes.
      parameters:
        - name: content-length
          in: header
          required: true
          schema:
            type: integer
            format: int64
          description: |
            The size of the complete payload in bytes.
            This is used to determine if the payload needs to be 
            split into chunks and how.
        - name: x-agrirouter-is-publish
          in: header
          required: true
          schema:
            type: boolean
          description: |
            If set to true, the message will be sent as a published message
            and any endpoints that are subscribed to the message type
            would be able to receive it, provided other conditions for routing are met.
        - name: x-agrirouter-direct-recipients
          in: header
          required: false
          schema:
            type: array
            items:
              type: string
              format: uuid
          description: |
            Comma-separated list of agrirouter endpoint IDs of the direct recipients.
            Allows specifying direct recipients of the message, which
            could receive it even if they are not subscribed to the message type.
        - name: x-agrirouter-sent-timestamp
          in: header
          required: true
          schema:
            type: string
            format: date-time
          description: |
            Client side timestamp of sending the data.
        - name: x-agrirouter-endpoint-id
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: |
            The agrirouter endpoint ID of the sender.
            This is the ID of the endpoint that is sending the message.
        - name: x-agrirouter-teamset-context-id
          in: header
          required: false
          schema:
            type: string
            maxLength: 100
          description: |
            A teamset is a set of connected machines that work and move together 
            and are connected to the same (virtual) communication unit. 
            The machines in the teamset are typically connected physically and 
            informationally (for example via ISOBUS).
        - name: x-agrirouter-message-type
          in: header
          required: true
          schema:
            type: string
            maxLength: 100
          description: |
            Message type of the sent data. See available types here:
            https://docs.agrirouter.com/agrirouter-interface-documentation/latest/tmt/overview.html
          examples:
            iso11783DeviceDescriptionProtobuf:
              summary: Device Description
              value: "iso:11783:-10:device_description:protobuf"
            iso11783TaskDataZip:
              summary: ISO11783 Task Data Zip
              value: "iso:11783:-10:taskdata:zip"
        - $ref: "#/components/parameters/x-agrirouter-tenant-id"
        - name: x-agrirouter-filename
          in: header
          required: false
          schema:
            type: string
            maxLength: 100
          description: |
            Optional name of the file that is attached to messages as metadata.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Message successfully sent to inbox
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '413':
          description: Content too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Server Side Error
  /events:
    get:
      operationId: receiveEvents
      summary: Receive events from agrirouter outbox
      parameters:
        - name: types
          in: query
          required: false
          description: |
            Events type filter, if provided would limit the events returned to only those of the specified types.
            If not provided, all supported events will be streamed.
          example: ["MESSAGE_RECEIVED", "FILE_RECEIVED", "AUTHORIZATION_ADDED"]
          schema:
            type: array
            items:
              type: string
              enum:
                - MESSAGE_RECEIVED
                - FILE_RECEIVED
                - ENDPOINT_DELETED
                - ENDPOINTS_LIST_CHANGED
                - AUTHORIZATION_ADDED
                - AUTHORIZATION_REVOKED
      description: |
        Receive stream of events from the agrirouter outbox.
        The events are retrieved for every endpoint of an
        authorized application.

        These are possible event types:
        - MESSAGE_RECEIVED - when one message is received
        - FILE_RECEIVED - when chunked payload has been completely received
        - ENDPOINTS_LIST_CHANGED - when the list of endpoints in a tenant changes
        - AUTHORIZATION_ADDED - when a tenant authorization is newly added
        - AUTHORIZATION_REVOKED - when a tenant authorization is revoked

        These events are sent as Server-Sent Events (SSE), where one line
        prefixed "event:" would define event type and another line
        prefixed "data:" would contain the actual event data.

        See Server-Sent Events specification here:
        https://html.spec.whatwg.org/multipage/server-sent-events.html#server-sent-events

        For example:
        
        ```
        event: MESSAGE_RECEIVED
        data: {"messageId":"12345","timestamp":"2023-01-01T12:00:00Z"}
        ```

        In this API, `data` would always be JSON encoded object, every
        event data schema is defined in the `#/components/schemas`, with
        schema name always ending with `EventData`. 

        Here is a table:

        | Event Type          | Schema                                                                     |
        |---------------------|----------------------------------------------------------------------------|
        | MESSAGE_RECEIVED    | [MessageReceivedEventData](#/components/schemas/MessageReceivedEventData)  |
        | FILE_RECEIVED       | [FileReceivedEventData](#/components/schemas/FileReceivedEventData)        |
        | ENDPOINT_DELETED    | [EndpointDeletedEventData](#/components/schemas/EndpointDeletedEventData)  |
        | ENDPOINTS_LIST_CHANGED | [EndpointsListChangedEventData](#/components/schemas/EndpointsListChangedEventData) |
        | AUTHORIZATION_ADDED | [AuthorizationAddedEventData](#/components/schemas/AuthorizationAddedEventData) |
        | AUTHORIZATION_REVOKED | [AuthorizationRevokedEventData](#/components/schemas/AuthorizationRevokedEventData) |

      # As there is no yet accepted way of defining schema for SSE data,
      # it would have to be only described in description for now.
      responses:
        '200':
          description: Stream of events from agrirouter
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GenericEventData"
        '400':
          description: Request is invalid
        '401':
          description: Authentication failed
        '403':
          description: Authorization failed
        '500':
          description: Server Side Error

  /confirmations:
    post:
      operationId: confirmMessages
      summary: Confirm received messages
      description: |
        Confirm that messages have been received and processed by the application.
        Each confirmation carries a message ID and the endpoint ID that received it.
        The same message may be received by different endpoints and can be confirmed
        separately, either in the same request or in different ones.
      parameters:
        - $ref: "#/components/parameters/x-agrirouter-tenant-id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmMessagesRequest"
      responses:
        '202':
          description: Confirmation is saved for processing, feed will be updated eventually
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Server Side Error

  /tenants/{tenantId}/endpoints:
    get:
      operationId: listTenantEndpoints
      summary: List tenant endpoints with route information
      description: |
        Returns the current list of endpoints in the tenant together with their
        capability information.

        For endpoints owned by the authorized application, this operation also
        returns route-derived maps describing which endpoints they can send to
        and receive from for each message type.

        This operation is tenant-scoped and is intended for inspecting or
        refreshing endpoint information for one already-known tenant. Use it
        for example if you cannot/do not want to persist information from the
        `ENDPOINT_LIST_CHANGED` event or if your frontend doesn't have access to that
        data.

        It is not intended as the primary application-start or global re-sync operation.
        For that purpose, use `GET /tenants`, which returns all currently
        authorized tenants together with their related endpoints.
      parameters:
        - $ref: "#/components/parameters/tenantId"
      responses:
        '200':
          description: Tenant endpoints successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointsListResponse"
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Server Side Error

  /tenants:
    get:
      operationId: listAuthorizedTenants
      summary: List all authorized tenants and their related endpoints
      description: |
        Returns all tenants for which the current application has an existing
        authorization together with the related endpoints known for each tenant.

        This operation is intended as the primary global synchronization
        endpoint, for example when an application starts, recovers after a
        crash, or otherwise needs to rebuild its complete tenant state.
      responses:
        '200':
          description: Authorized tenants successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantsListResponse"
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Server Side Error

  /compatible-applications:
    get:
      operationId: listCompatibleApplications
      summary: List applications compatible with an initiating application
      description: |
        Returns the catalog of applications whose declared capabilities are
        compatible with the application that would initiate the connection,
        i.e. messages could flow between them in at least one direction.
        Compatibility is computed from declared capabilities, so the result
        is available before any endpoint exists for the source.
      parameters:
        - name: initiating_application_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: The initiating application to find compatible applications for.
      responses:
        '200':
          description: Compatible applications successfully retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatibleApplicationsResponse"
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: source_application_id does not match the authenticated application
        '429':
          description: Too many requests
        '500':
          description: Server Side Error

  /endpoints/{externalId}:
    put:
      operationId: putEndpoint
      summary: Create or update endpoint
      description: This resource could be used to create new endpoint or reconfigure existing one.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      parameters:
        - $ref: "#/components/parameters/x-agrirouter-tenant-id"
        - $ref: "#/components/parameters/externalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutEndpointRequest"
      responses:
        '200':
          description: Endpoint was successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        '201':
          description: Endpoint was successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '413':
          description: Content too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error
    delete:
      operationId: deleteEndpoint
      summary: Delete endpoint
      description: Delete endpoint by external ID. This would remove the endpoint from agrirouter and it would no longer receive messages.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      parameters:
        - $ref: "#/components/parameters/x-agrirouter-tenant-id"
        - $ref: "#/components/parameters/externalId"
      responses:
        '204':
          description: Endpoint successfully deleted
        '400':
          description: Request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '403':
          description: Authorization failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '404':
          description: Endpoint with the specified external ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Server Side Error

  # ------------------------------------------------------- masterdata sync


  # ------------------------------------------------------- masterdata sync

  /masterdata/organizations/{local_id}:
    put:
      operationId: putOrganization
      tags: [Masterdata]
      summary: Send (create or update) an organization
      description: >
        Submits an organization from the calling endpoint, identified by the
        application's own local_id. An update to an existing organization must
        carry the revision it was edited from in x-agrirouter-base-revision.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      parameters:
        - $ref: '#/components/parameters/LocalId'
        - $ref: '#/components/parameters/AgrirouterEndpointId'
        - $ref: '#/components/parameters/x-agrirouter-tenant-id'
        - $ref: '#/components/parameters/BaseRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '200':
          description: Organization accepted; the resulting canonical object is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '201':
          description: A new canonical object was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MappingConflict'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '428':
          $ref: '#/components/responses/BaseRevisionRequired'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error

  /masterdata/organizations/{local_id}/id-mapping/{agrirouter_id}:
    parameters:
      - $ref: '#/components/parameters/LocalId'
      - $ref: '#/components/parameters/IdMappingAgrirouterId'
      - $ref: '#/components/parameters/AgrirouterEndpointId'
      - $ref: '#/components/parameters/x-agrirouter-tenant-id'
    put:
      operationId: bindOrganizationMapping
      tags: [Masterdata]
      summary: Bind a local identifier to an existing organization
      description: >
        Declares that the canonical organization in the path is the one this
        endpoint already knows as local_id, so a later PUT under that local_id
        updates it instead of creating a duplicate.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      responses:
        '204':
          description: The mapping is recorded.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MappingConflict'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error
    delete:
      operationId: unbindOrganizationMapping
      tags: [Masterdata]
      summary: Declare that this endpoint no longer holds an organization
      description: >
        Declares that the endpoint no longer holds the canonical organization
        under this local_id. The canonical object itself is untouched and is
        delivered again, without a local_id, on its next change.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      responses:
        '204':
          description: >
            The endpoint holds no mapping for this pair. Returned whether or
            not one existed, so a retry after a lost response is safe.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error

  /masterdata/organizations/{local_id}/deactivation:
    post:
      operationId: deactivateOrganization
      tags: [Masterdata]
      summary: Deactivate an organization
      description: >
        Signals that the organization was deactivated in the source system.
        The canonical object is kept but marked inactive. Deactivating an
        already-inactive organization is a no-op.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      parameters:
        - $ref: '#/components/parameters/LocalId'
        - $ref: '#/components/parameters/AgrirouterEndpointId'
        - $ref: '#/components/parameters/x-agrirouter-tenant-id'
        - $ref: '#/components/parameters/BaseRevision'
      responses:
        '200':
          description: Organization is inactive (either newly deactivated or already inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '428':
          $ref: '#/components/responses/BaseRevisionRequired'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error

  /masterdata/organizations/requests:
    post:
      operationId: requestOrganization
      tags: [Masterdata]
      summary: Request an organization (lazy loading)
      description: >
        Refetches an organization the calling endpoint is entitled to but
        does not currently hold. The object arrives asynchronously on the
        master-data event stream.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      parameters:
        - $ref: '#/components/parameters/AgrirouterEndpointId'
        - $ref: '#/components/parameters/x-agrirouter-tenant-id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityRequest'
      responses:
        '202':
          $ref: '#/components/responses/RequestAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error

  /masterdata/persons/{local_id}:
    put:
      operationId: putPerson
      tags: [Masterdata]
      summary: Send (create or update) a person
      description: >
        Submits a person from the calling endpoint, identified by the
        application's own local_id. An update to an existing person must
        carry the revision it was edited from in x-agrirouter-base-revision.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      parameters:
        - $ref: '#/components/parameters/LocalId'
        - $ref: '#/components/parameters/AgrirouterEndpointId'
        - $ref: '#/components/parameters/x-agrirouter-tenant-id'
        - $ref: '#/components/parameters/BaseRevision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Person'
      responses:
        '200':
          description: Person accepted; the resulting canonical object is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '201':
          description: A new canonical object was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MappingConflict'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '428':
          $ref: '#/components/responses/BaseRevisionRequired'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error

  /masterdata/persons/{local_id}/id-mapping/{agrirouter_id}:
    parameters:
      - $ref: '#/components/parameters/LocalId'
      - $ref: '#/components/parameters/IdMappingAgrirouterId'
      - $ref: '#/components/parameters/AgrirouterEndpointId'
      - $ref: '#/components/parameters/x-agrirouter-tenant-id'
    put:
      operationId: bindPersonMapping
      tags: [Masterdata]
      summary: Bind a local identifier to an existing person
      description: >
        Declares that the canonical person in the path is the one this
