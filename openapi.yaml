              schema:
                $ref: '#/components/schemas/InitialLoadStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The endpoint's initial load is COMPLETED, and a completed load is
            waiting on nobody.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterdataError'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error

security:
  - agrirouterOauthQA: []
  - agrirouterOauthPROD: []

components:
  securitySchemes:
    agrirouterOauthQA:
      type: oauth2
      description: Agrirouter OAuth2 authentication for QA environment.
      flows:
        clientCredentials:
          tokenUrl: https://oauth.qa.agrirouter.farm/token
          scopes: {}
    agrirouterOauthPROD:
      type: oauth2
      description: Agrirouter OAuth2 authentication for PROD environment.
      flows:
        clientCredentials:
          tokenUrl: https://api-oauth.agrirouter.com/token
          scopes: {}
  parameters:
    x-agrirouter-tenant-id:
      name: x-agrirouter-tenant-id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: The farmer's tenant ID in relation to which communication is done.
    tenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The farmer's tenant ID in relation to which this operation is performed.
    externalId:
      name: externalId
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 255
        pattern: '^([uU][rR][nN]:)?[a-zA-Z0-9][a-zA-Z0-9-]{0,31}:[a-zA-Z0-9()+,\-.:=@;$_!*%/?#]+$'
      description: |
        Application-defined external ID of the endpoint. SHOULD be formatted as a
        URN as defined by RFC 8141 (e.g. `urn:my-app:endpoint:42`). The `urn:`
        prefix itself is optional for backwards compatibility, but the value must
        always contain a namespace identifier and a namespace-specific string
        separated by a colon. The URN namespace identifier and namespace-specific
        string allow applications to scope their endpoint IDs in a stable,
        globally unique way.
    LocalId:
      name: local_id
      in: path
      required: true
      description: >
        The calling application's own identifier for the master-data entity.
        Unique across the whole application per entity type, whichever of
        its endpoints sends it: the mapping is keyed on (application,
        local_id). A local identifier already mapped to a different canonical
        object is rejected.
      schema:
        type: string
    AgrirouterEndpointId:
      name: x-agrirouter-endpoint-id
      in: header
      required: true
      description: >
        The endpoint acting on this request — the sender of an entity, the
        caller of a request, the holder of a binding. It decides entitlement
        and the tenant, and it becomes the source endpoint of any revision
        produced. It does not scope local_id, which resolves in the
        application's namespace.


        This is the agrirouter endpoint ID, not the externalId the
        application chose for it. An application already holds it: it is
        returned when the endpoint is created or updated, listed with the
        tenant's endpoints, and carried on the endpoint events.
      schema:
        type: string
        format: uuid
    BaseRevision:
      name: x-agrirouter-base-revision
      in: header
      required: false
      description: >
        The revision the client edited from — the base of this write. It
        travels as a header because it is a precondition on the request, not
        part of the entity: revision in the body stays read-only and
        server-assigned.


        Required on a write to an object that already exists; absent there is
        428, since omitting it would opt the client out of concurrency
        control. Absent on a create is normal, there being no base. Present
        on a request that does not resolve to an existing object it is 412:
        the client believes it is updating something agrirouter does not
        know under that local_id.


        A base behind the current revision is not necessarily a failure:
        agrirouter merges where the client's change and the intervening ones
        do not overlap and answers 200 with the merged object, and answers
        412 with the current revision where they do overlap.
      schema:
        type: integer
        minimum: 1
    IdMappingAgrirouterId:
      name: agrirouter_id
      in: path
      required: true
      description: >
        The canonical object the local identifier in the path denotes. The
        endpoint at the other end of the mapping is scoped exactly as the
        entity path it hangs off, so it is not a segment here.
      schema:
        type: string
        format: uuid
    ExternalEndpointId:
      name: external_id
      in: path
      required: true
      description: >
        The application's own identifier for the endpoint — the externalId
        it supplied when creating it, and the same key the endpoint resource
        itself is addressed by. Configuration and initial-load state are
        addressed this way, as endpoint management is; the entity operations
        name the acting endpoint by its agrirouter ID in a header instead, as
        sending does.
      schema:
        type: string
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >
        The event id the calling application last saved from the
        /masterdata/events stream, as agrirouter issued it in the id: field
        of an SSE frame. Send it back exactly as issued: it is an opaque
        string that must not be interpreted, compared, constructed, or
        modified in any way, and it does not always advance on every frame.


        Save it from what the application has durably applied rather than
        from whatever its stream client last read, since delivery is
        at-least-once and everything after it is sent again on reconnect. It
        does not expire.


        Omitted, or present and one agrirouter cannot validate, is served as
        a first connection on this stream: everything the application is
        entitled to, ending with a CAUGHT_UP frame. This parameter applies to
        /masterdata/events only; the initial-load stream carries no position
        and does not accept it.
      schema:
        type: string
      example: 'v1.f8yQ_KL5hHBS.TBQjL_8GeXSs6TIxFzsdQQ'
  responses:
    RequestAccepted:
      description: >
        Request accepted; the entity will be delivered via the event stream
        if the caller is entitled to it.
    ValidationError:
      description: >
        The payload failed hard validation against the master-data subset
        and was rejected without being applied or forwarded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MasterdataError"
    Forbidden:
      description: >
        The caller is not the owner of the endpoint, or is not opted in /
        not permitted to write the entity type.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MasterdataError"
    NotFound:
      description: No such entity, or the caller is not entitled to it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MasterdataError"
    RevisionConflict:
      description: >
        The write could not be applied against its
        x-agrirouter-base-revision: the base is behind the current revision
        and the changes since overlap with the client's, so no merge is
        possible; or the base is one agrirouter never issued for this
        object; or a base was given for a local_id that does not resolve to
        an existing object. The body carries the current revision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RevisionConflictError"
    BaseRevisionRequired:
      description: >
        The object exists and the request carried no
        x-agrirouter-base-revision. Concurrency control is not optional on
        an update. The body carries the current revision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RevisionConflictError"
    MappingConflict:
      description: >
        The supplied local identifier is already mapped to a different
        canonical object, or — when binding — the canonical object is
        already bound to a different local identifier of this application.
        The body names which of the two identifiers is taken, and the
        mapping that holds it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MappingConflictError"
    InitialLoadConflict:
      description: >
        The requested transition is not valid from the endpoint's current
        initial load state (e.g. confirming before the set has been sent,
        or completing before confirming).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MasterdataError"
  schemas:
    GenericEventData:
      oneOf:
        - $ref: "#/components/schemas/MessageReceivedEventData"
        - $ref: "#/components/schemas/FileReceivedEventData"
        - $ref: "#/components/schemas/EndpointDeletedEventData"
        - $ref: "#/components/schemas/EndpointsListChangedEventData"
        - $ref: "#/components/schemas/AuthorizationAddedEventData"
        - $ref: "#/components/schemas/AuthorizationRevokedEventData"
      discriminator:
        propertyName: event_type
    PayloadURI:
      type: string
      format: uri
      description: |
        The URI to access the payload. May have hostname that is different from
        the API server, as payloads may be served from a different server or CDN.
        Clients MUST use provided URI as is without any modifications.
        If event embeds payload directly, this field would be absent.
    MessageReceivedEventData:
      type: object
      description: |
        Data structure for MESSAGE_RECEIVED events. This event would arrive whenever application
        got a message routed to one of its endpoints.
      required:
        - id
        - message_type
        - app_message_id
        - sent_at
        - event_type
        - receiving_endpoint_id
      properties:
        id:
          type: string
          format: uuid
          description: |
            The agrirouter message ID of the received message, generated by agrirouter.
            Use this value as `message_id` when confirming the message via `POST /confirmations`.
        app_message_id:
          type: string
          description: |
            The application message ID of the received message.
            This is not guaranteed to be a UUID in any case and should not be
            relied upon as a stable or unique identifier. It only provides
            troubleshooting information in collaboration with the agrirouter team.
        message_type:
          type: string
          example: "iso:11783:-10:taskdata:zip"
          description: |
            The message type of the received message.
            See available types here:
            https://docs.agrirouter.com/agrirouter-interface-documentation/latest/tmt/overview.html
        sent_at:
          type: string
          format: date-time
          description: The timestamp when the message was sent by sending application.
        received_at:
          type: string
          format: date-time
          description: The timestamp when the message was received by agrirouter.
        payload:
          type: string
          format: byte
          description: The payload of the message, base64 encoded. Only one of `payload` or `payload_uri` would be present.
        payload_uri:
          $ref: "#/components/schemas/PayloadURI"
        event_type:
          type: string
          const: MESSAGE_RECEIVED
        receiving_endpoint_id:
          type: string
          format: uuid
          description: Internally-generated agrirouter ID of the receiving endpoint.
        sending_endpoint_id:
          type: string
          format: uuid
          description: |
            The agrirouter endpoint ID of the endpoint that sent the message.
            May be absent if the sender could not be determined for this message.
        filename:
          type: string
          description: Optional name of the file that is attached to messages as metadata.
        tenant_id:
          type: string
          description: The tenant ID of the to which receiving endpoint belongs. This is useful for confirming messages back to agrirouter.
        teamset_context_id:
          type: string
          description: The teamset context ID that was provided by sending application when sending the message, if any.
    EndpointDeletedEventData:
      type: object
      description: |
        Data structure for ENDPOINT_DELETED events. This event would arrive whenever one of the endpoints of the application is deleted from agrirouter, either by this API or by other means.
      required:
        - id
        - external_id
        - event_type
      properties:
        id:
          type: string
          format: uuid
          description: The agrirouter endpoint ID of the deleted endpoint.
        external_id:
          type: string
          description: The external ID of the deleted endpoint, which was provided when creating or updating the endpoint.
        event_type:
          type: string
          const: ENDPOINT_DELETED
    EndpointsListChangedEventData:
      type: object
      description: |
        Data structure for ENDPOINTS_LIST_CHANGED events. This event would
        arrive whenever the set of endpoints visible to the application, or
        their respective capabilities and/or routes, change in a tenant.

        ENDPOINTS_LIST_CHANGED is only emitted once the application has at
        least one endpoint of its own in the target tenant. Until that first
        application-owned endpoint exists, changes to other endpoints in the
        tenant are not reported, even if an authorization is in place. Once
        the first own endpoint is created, clients receive events for any
        subsequent change to the visible endpoint set.
      required:
        - event_type
        - tenant_id
        - endpoints
      properties:
        event_type:
          type: string
          const: ENDPOINTS_LIST_CHANGED
        tenant_id:
          type: string
          format: uuid
          description: The tenant whose endpoint list changed.
        endpoints:
          type: array
          description: |
            Complete current list of endpoints in the tenant that are visible
            to the application.
          items:
            $ref: "#/components/schemas/TenantEndpointInfo"
    AuthorizationAddedEventData:
      type: object
      description: |
        Data structure for AUTHORIZATION_ADDED events. This event would arrive
        whenever a user adds an authorization for a tenant to the current
        application.

        An authorization is uniquely identified by the triple
        (tenant_id, application_id, scope). The application_id is implicit from
        the receiving subscription; tenant_id and scope are explicit on this
        event. At present the only scope in use is `endpoints:manage`;
        additional scopes may be added in the future, and clients should then
        treat authorizations with different scopes as distinct authorizations
        even when tenant_id matches.
      required:
        - event_type
        - tenant
        - scope
      properties:
        event_type:
          type: string
          const: AUTHORIZATION_ADDED
        tenant:
          $ref: "#/components/schemas/TenantInfo"
        scope:
          type: string
          description: |
            The OAuth scope that was granted with this authorization. Today
            the only scope in use is `endpoints:manage`; additional scopes may
            be introduced in future revisions of this API.
          example: "endpoints:manage"
        state:
          type: string
          description: |
            Echoes the `state` value the partner supplied on the OAuth2
            authorization request, allowing their backend to correlate this
            event to their own customer. May be absent for authorizations
            created before this field existed.
    AuthorizationRevokedEventData:
      type: object
      description: |
        Data structure for AUTHORIZATION_REVOKED events. This event would
        arrive whenever a user revokes an authorization for a tenant from the
        current application. When this event is delivered to you, you have
        already lost access to the target tenant for the given scope. You
        should clean up all information related to this tenant (for that scope)
        and update your state accordingly.

        All endpoints that were previously accessible via this authorization
        are considered removed. You will receive distinct ENDPOINT_DELETED
        events for all endpoints deleted as a result of the authorization
        revocation.

        Authorizations are uniquely identified by
        (tenant_id, application_id, scope); only the authorization matching the
        `scope` below was revoked. At present only the `endpoints:manage`
        scope is in use, but if additional scopes are introduced later, other
        scopes for the same tenant would remain in effect.
      required:
        - event_type
        - tenant_id
        - scope
      properties:
        event_type:
          type: string
          const: AUTHORIZATION_REVOKED
        tenant_id:
          type: string
          format: uuid
          description: The tenant whose authorization was revoked.
        scope:
          type: string
          description: |
            The OAuth scope of the authorization that was revoked. Today the
            only scope in use is `endpoints:manage`; additional scopes may be
            introduced in future revisions of this API.
          example: "endpoints:manage"
    FileReceivedEventData:
      type: object
      description: |
        Data structure for FILE_RECEIVED events. This event shall arrive whenever a big file transfer
        has completed in its entirety, i.e when big payload was sent as several message chunks, this
        event would be sent last when the complete payload is received.

        To read payload from this event when using the `payload_uri` field to download
        the complete payload, it is not required to provide Authorization for this
        request, as the URI itself contains access to that specific payload.

        These URIs are time-limited and would expire after at most 15 minutes, so clients 
        should download the payload before that happens.
      required:
        - event_type
        - receiving_endpoint_id
        - message_type
        - size
        - message_ids
      properties:
        payload_uri:
          $ref: "#/components/schemas/PayloadURI"
        payload:
          type: string
          format: byte
          description: |
            The payload of the file, base64 encoded. 
            Only one of `payload` or `payload_uri` can be present.
        event_type:
          type: string
          const: FILE_RECEIVED
        filename:
          type: string
          description: Optional name of the file that is attached to messages as metadata.
        receiving_endpoint_id:
          type: string
          format: uuid
          description: Internally-generated agrirouter ID of the receiving endpoint.
        sending_endpoint_id:
          type: string
          format: uuid
          description: |
            The agrirouter endpoint ID of the endpoint that sent the file.
            May be absent if the sender could not be determined for this file.
        sent_at:
          type: string
          format: date-time
          description: |
            The timestamp when the sending application started transmitting the file,
            as reported by sending application.

            It reflects the client-provided send time and
            may be absent if the sender did not supply a sent timestamp.
        message_type:
          type: string
          example: "iso:11783:-10:taskdata:zip"
          description: |
            The message type of the received payload.
            See available types here:
            https://docs.agrirouter.com/agrirouter-interface-documentation/latest/tmt/overview.html
        size:
          type: integer
          format: int64
          minimum: 0
          description: The size of file payload in bytes.
        message_ids:
          type: array
          items:
            type: string
            format: uuid
          description: |
            List of agrirouter message IDs of the messages that carried the file payload chunks.
            To confirm the file, all of these IDs must be confirmed via `POST /confirmations`,
            since a file may be a concatenation of chunks from the sender.
        tenant_id:
          type: string
          description: The tenant ID of the to which receiving endpoint belongs. This is useful for confirming messages back to agrirouter.
        teamset_context_id:
          type: string
          description: The teamset context ID that was provided by sending application when sending the message, if any.
    ConfirmMessagesRequest:
      type: object
      required:
        - confirmations
      properties:
        confirmations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/MessageConfirmation"
          description: List of message confirmations.
    MessageConfirmation:
      type: object
      required:
        - message_id
        - endpoint_id
      properties:
        message_id:
          type: string
          format: uuid
          description: The agrirouter message ID of the confirmed message.
        endpoint_id:
          type: string
          format: uuid
          description: The agrirouter endpoint ID that received the message.
    EndpointsListResponse:
      type: object
      required:
        - endpoints
      properties:
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/TenantEndpointInfo"
    TenantsListResponse:
      type: object
      required:
        - tenants
      properties:
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantInfo"
    TenantInfo:
      type: object
      required:
        - tenant_id
        - endpoints
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Authorized tenant ID.
        endpoints:
          type: array
          description: |
            Endpoints visible in this tenant, subject to the following
            privacy rule:

            - If the application has not yet created any endpoint of its own
              in this tenant, this array is empty — even if other endpoints
              exist in the tenant. This prevents exposing tenant contents to
              applications that have not yet actively participated in it.
            - Once the application has at least one of its own endpoints in
              the tenant, this array contains the full set of endpoints
              visible to the application.

            An authorized tenant with no application-owned endpoint will
            therefore still appear in `GET /tenants`, but with an empty
            `endpoints` array. See `owned_by_your_application` on
            `TenantEndpointInfo` for the distinction between own and other
            endpoints.
          items:
            $ref: "#/components/schemas/TenantEndpointInfo"
    TenantEndpointInfo:
      type: object
      required:
        - id
        - name
        - endpoint_type
        - application_id
        - tenant_id
        - owned_by_your_application
        - capabilities
      properties:
        id:
          type: string
          format: uuid
          description: The agrirouter endpoint ID.
        external_id:
          type: string
          description: External identifier of the endpoint, if available to the caller.
        name:
          type: string
          description: Display name of the endpoint.
        endpoint_type:
          $ref: "#/components/schemas/EndpointType"
        application_id:
          type: string
          format: uuid
          description: The ID of the application that owns the endpoint.
        tenant_id:
          type: string
          format: uuid
          description: The tenant ID of the endpoint.
        owned_by_your_application:
          type: boolean
          description: |
            Indicates whether this endpoint belongs to the application that is
            authorized for the current request.
        capabilities:
          $ref: "#/components/schemas/TenantEndpointCapabilities"
        routed_endpoints:
          $ref: "#/components/schemas/RoutedEndpoints"
    TenantEndpointCapabilities:
      type: object
      required:
        - can_send
        - can_receive
      properties:
        can_send:
          type: array
          description: Message types this endpoint can send.
          items:
            type: string
        can_receive:
          type: array
          description: Message types this endpoint can receive.
          items:
            type: string
    RoutedEndpoints:
      type: object
      description: |
        Route-derived information for this endpoint.

        This property only exists for endpoints owned by the authorized
        application. It is omitted for all other endpoints in the tenant.
      properties:
        can_send_to:
          $ref: "#/components/schemas/EndpointRouteMap"
        can_receive_from:
          $ref: "#/components/schemas/EndpointRouteMap"
    EndpointRouteMap:
      type: object
      description: |
        Map keyed by agrirouter endpoint ID. Each value lists the message types
        for which routing is currently possible between the two endpoints.
      additionalProperties:
        type: array
        items:
          type: string
          example: "iso:11783:-10:taskdata:zip"
    PutEndpointRequest:
      type: object
      required:
        - application_id
        - software_version_id
        - capabilities
        - subscriptions
        - endpoint_type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[\p{L}\p{N} _.,:@\-]+$'
          description: |
            Optional name of the endpoint, for easier identification in agrirouter web interface.
            Does not have to be unique.
            If not specified, the name would be generated automatically.

            When provided, must be 1-200 characters long and may contain letters from any
            script, digits, spaces, and the following special characters: `-`, `_`, `.`, `,`, `:`, `@`.
            Names consisting only of whitespace are not allowed as well, which is not
            expressed in the regex pattern.

            It is not guaranteed that this "application-set" name would be used, 
            because user may override it with "user-set" name in agrirouter web interface.
            Name send via this API cannot override "user-set" name, but
            it can update "application-set" name at any time and user can choose to
            switch name back to "application-set".
        application_id:
          type: string
          format: uuid
          description: The ID of the application that owns the endpoint
        software_version_id:
          type: string
          format: uuid
          description: The ID of the software version that owns the endpoint
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/EndpointCapability"
          description: The effective capabilities of the endpoint, must be subset of the capabilities of software version.
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/EndpointSubscription"
        endpoint_type:
          $ref: "#/components/schemas/EndpointTypeToCreate"
        allow_delete_by_user:
          type: boolean
          default: false
          description: >
            Flag indicating whether the user is allowed to delete this endpoint.

            Note that even when this flag is not set, the user can still force
            deletion of the endpoint. Applications must handle the ENDPOINT_DELETED
            event on a best-effort basis. It is also possible that an endpoint is
            deleted immediately after creation due to a race with the user
            disconnecting the entire application, so applications should not rely
            on this flag to prevent endpoint deletion entirely.
        connections_uri:
          type: string
          format: uri
          description: >
            URI pointing to where the user can manage the entity connected to this endpoint,
            e.g. to disconnect or delete equipment from an equipment vendor.
            When provided, this URI will be shown when the user attempts to delete the endpoint,
            instead of the usual deletion dialog, directing them to the vendor's management page.
        owner_endpoint_external_id:
          type: string
          description: >
            Optional external ID of the endpoint that should own (be the parent of) this endpoint.
            The referenced owner endpoint must belong to the same tenant and the same application
            as this endpoint, otherwise the request is rejected.

            When the owner endpoint is deleted, the endpoints it owns are deleted as well.

            Note that the owner endpoint must already be processed internally. Since endpoint state
            is propagated asynchronously, an owner endpoint that was just created may not yet be
            resolvable
        masterdata:
          $ref: '#/components/schemas/MasterdataConfig'
    Endpoint:
      type: object
      required:
        - id
        - external_id
        - endpoint_type
        - tenant_id
        - application_id
        - software_version_id
        - capabilities
      properties:
        id:
          type: string
          format: uuid
        external_id:
          type: string
        application_id:
          type: string
          format: uuid
        software_version_id:
          type: string
          format: uuid
        endpoint_type:
          $ref: "#/components/schemas/EndpointType"
        tenant_id:
          type: string
          description: The tenant ID of the endpoint
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/EndpointCapability"
        allow_delete_by_user:
          type: boolean
          default: false
          description: Flag indicating whether the user is allowed to delete this endpoint.
          readOnly: true
        connections_uri:
          type: string
          format: uri
          description: >
            URI pointing to where the user can manage the entity connected to this endpoint,
            e.g. to disconnect or delete equipment from an equipment vendor.
          readOnly: true
        owner_endpoint_external_id:
          type: string
          description: >
            External ID of the endpoint that owns (is the parent of) this endpoint, if any.
          readOnly: true
        masterdata:
          $ref: '#/components/schemas/MasterdataConfig'
    EndpointSubscription:
      type: object
      required:
        - message_type
      properties:
        message_type:
          type: string
          example: "iso:11783:-10:taskdata:zip"
          description: |
            The message type that the endpoint is subscribed to.
            See available types here:
            https://docs.agrirouter.com/agrirouter-interface-documentation/latest/tmt/overview.html
    EndpointCapability:
      type: object
      required:
        - message_type
        - direction
      properties:
        message_type:
          type: string
          example: "iso:11783:-10:taskdata:zip"
          description: |
            The message type that the endpoint can send or receive.
            See available types here:
            https://docs.agrirouter.com/agrirouter-interface-documentation/latest/tmt/overview.html
        direction:
          type: string
          enum:
            - "SEND"
            - "RECEIVE"
            - "SEND_RECEIVE"
    CompatibleApplicationsResponse:
      type: object
      required:
        - compatible_applications
      properties:
        compatible_applications:
          type: array
          description: Applications compatible with the initiating application.
          items:
            $ref: "#/components/schemas/CompatibleApplication"
    CompatibleApplication:
      type: object
      required:
        - application_id
        - name
        - type
        - compatible_capabilities
      properties:
        application_id:
          type: string
          format: uuid
          description: The catalog ID of the compatible application.
        name:
          type: string
          description: Display name of the application.
        brand:
          type: string
          description: Brand of the application.
        description:
          type: string
          description: Description of the application.
        logo_url:
          type: string
          description: URL of the application's logo.
        type:
          $ref: "#/components/schemas/ApplicationType"
        compatible_capabilities:
          $ref: "#/components/schemas/ApplicationCapabilities"
    ApplicationType:
      type: string
      description: |
        Catalog type of an application. It determines how the application is
        connected: a `COMMUNICATION_UNIT` is onboarded with a registration
        code entered on the machine, every other type via its own deep URL.
      enum:
        - COMMUNICATION_UNIT
        - FARMING_SOFTWARE
        - TELEMETRY_PLATFORM
        - G4_APPLICATION
    ApplicationCapabilities:
      type: object
      required:
        - can_send
        - can_receive
      properties:
        can_send:
          type: array
          description: Message types this application can send.
          items:
            type: string
        can_receive:
          type: array
          description: Message types this application can receive.
          items:
            type: string
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: A human-readable error message describing what went wrong.
    EndpointType:
      type: string
      description: |
        Type of an endpoint that can be observed in the system. This includes
        types that can be created via this G4 API as well as legacy types that
        can only be created via the G2/G3 APIs. For values accepted when
        creating an endpoint, see `EndpointTypeToCreate`.
      enum:
        - cloud_software
        - virtual_communication_unit
        - communication_unit
        - telemetry_platform
    EndpointTypeToCreate:
      type: string
      description: |
        Type of an endpoint that can be created via this G4 API. Legacy types
        such as `communication_unit` and `telemetry_platform` cannot be
        created here; see `EndpointType` for the full set that may be observed.

        `farming_software` is accepted as a deprecated alias for
        `cloud_software` and will be removed in a future revision.
      enum:
        - cloud_software
        - virtual_communication_unit
        - farming_software

    MasterdataError:
      type: object
      properties:
        message:
          type: string
      required: [message]

    RevisionConflictError:
      description: >
        The `412` or `428` of a write: an `Error` carrying the revision the
        object is currently at, so that the client has the answer a rejected
        write would otherwise have to fetch separately.
      allOf:
        - $ref: '#/components/schemas/MasterdataError'
        - type: object
          properties:
            current_revision:
              type: integer
              description: The canonical object's current `revision`.
          required: [current_revision]

    MappingConflictError:
      description: >
        The `409` of a binding: an `Error` carrying the rejection that caused it.
        The same shape the bulk path returns per pair, so an endpoint resolves a
        conflict identically whichever path raised it. As there, the outcome is
        carried by `rejection.reason`; the `message` of the `Error` is diagnostic
        and MUST NOT be branched on.
      allOf:
        - $ref: '#/components/schemas/MasterdataError'
        - type: object
          properties:
            rejection:
              $ref: '#/components/schemas/IdMappingRejection'
          required: [rejection]

    IdMappingRejectionReason:
      type: string
      description: >
        [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
        Why a binding could not be recorded.


        `LOCAL_ID_ALREADY_BOUND` — this endpoint already knows a different
        canonical object by that `local_id`. `existing_mapping` names it.


        `AGRIROUTER_ID_ALREADY_BOUND` — this endpoint already knows that
        canonical object by a different `local_id`. `existing_mapping` names it.


        `UNKNOWN_OBJECT` — no such canonical object, or the endpoint is not
        entitled to it. On the per-entity operation this is the `404` instead.


        `DUPLICATE_IN_REQUEST` — the same `local_id` or the same `agrirouter_id`
        appears in more than one pair of this request, which would make the
        outcome depend on the order pairs were applied in. Every pair involved is
        rejected and none is applied. Bulk path only.
      examples:
        - LOCAL_ID_ALREADY_BOUND
        - AGRIROUTER_ID_ALREADY_BOUND
        - UNKNOWN_OBJECT
        - DUPLICATE_IN_REQUEST

    IdMappingRejection:
      description: >
        A binding that could not be recorded: the pair as submitted, why, and
        the mapping standing in its way.
      allOf:
        - $ref: '#/components/schemas/IdMappingBinding'
        - type: object
          properties:
            reason:
              $ref: '#/components/schemas/IdMappingRejectionReason'
            existing_mapping:
              $ref: '#/components/schemas/IdMappingBinding'
              description: >
                The mapping that already holds the taken identifier. Both of its
                ends belong to the rejected endpoint itself, so naming it
                discloses nothing the endpoint does not already hold, and it is
                what the endpoint shows the user resolving the conflict. Present
                for `LOCAL_ID_ALREADY_BOUND` and `AGRIROUTER_ID_ALREADY_BOUND`,
                absent for the other reasons, where no mapping is in the way.
          required: [reason]

    EntityRequest:
      type: object
      description: A lazy-loading request for a single canonical object.
      properties:
        agrirouter_id:
          type: string
          format: uuid
          description: The canonical identifier of the wanted entity.
      required: [agrirouter_id]

    EntityReference:
      type: object
      description: >
        A reference to another entity by canonical and/or local id. On send
        either identifier suffices: a local_id is resolved against the sender's
        own mapping, and is rejected if the target has not been sent yet. On
        delivery agrirouter populates agrirouter_id, since the sender's local_id
        does not resolve in the receiver's namespace.
      properties:
        agrirouter_id:
          type: string
          format: uuid
        local_id:
          type: string
      anyOf:
        - required: [agrirouter_id]
        - required: [local_id]

    IdMappingBinding:
      type: object
      description: >
        One binding of a local identifier to a canonical object, as carried in
        bulk on the initial-load confirmation.


        Both ends belong to the calling application's own store: the object it
        matched, and what it calls that object. A mapping only ever travels from
        an application to agrirouter.
      properties:
        agrirouter_id:
          type: string
          format: uuid
        local_id:
          type: string
      required: [agrirouter_id, local_id]

    Envelope:
      type: object
      description: >
        Fields common to every master-data entity. The concrete entity type is
        determined by the path; each entity schema pins the `type` discriminator
        so that objects remain self-describing on the event stream.


        agrirouter assigns `agrirouter_id`, `revision`, `modified_at`,
        `tenant_id`, `source_endpoint_id`, and `type`. An object may be sent
        back as it was delivered, these included: `revision`, `modified_at`,
        and `source_endpoint_id` are ignored on send; `agrirouter_id`,
        `tenant_id`, and `type` must match the object written, or the write
        is a 400.


        An optional attribute declared nullable accepts `null` on a write, where
        it removes the attribute. agrirouter never delivers `null`: an attribute
        absent from a delivered object is unset.
      properties:
        agrirouter_id:
          type: string
          format: uuid
          description: >
            Canonical identifier, assigned by agrirouter. Absent on first send.
            If sent, it must be the object `local_id` is bound to.
        local_id:
          type: string
          description: >
            Always the *calling* application's own identifier for the entity, in
            both directions: on send the sender's, on delivery the receiving
            application's. It never carries another application's identifier.
            One store per application, so the identifier is the same whichever
            of the application's endpoints sends or receives it.


            Required on send. On delivery it is present when agrirouter holds a
            mapping for the receiving application, and absent when it does not —
            an object the application has not bound, or has unbound. An absent
            `local_id` means "you do not hold this object": create it locally and
            bind the identifier you issue.
        active:
          type: boolean
          default: true
        revision:
          type: integer
          description: >
            Monotonic per-object counter maintained by agrirouter. Never taken
            from the body: the revision a write was made from travels in the
            `x-agrirouter-base-revision` header, where it is compared and
            discarded. Ignored on send.
        modified_at:
          type: string
          format: date-time
          description: Assigned by agrirouter. Ignored on send.
        tenant_id:
          type: string
          format: uuid
          description: >
            The tenant the object belongs to. Assigned by agrirouter. On send
            the tenant follows from the endpoint named in
            `x-agrirouter-endpoint-id`; a `tenant_id` sent must be that tenant.


            One application stream carries every tenant the application is
            routed to, so on delivery this is the field that says which of them
            an object belongs to. A receiver holding data for several tenants
            partitions on it rather than on the connection.
        source_endpoint_id:
          type: string
          format: uuid
          description: >
            The agrirouter identifier of the endpoint whose change produced this
            revision. It always belongs to `tenant_id`. Ignored on send.

    Address:
      type: object
      properties:
        street:
          type: [string, 'null']
        po_box:
          type: [string, 'null']
        postal_code:
          type: [string, 'null']
        city:
          type: [string, 'null']
        state:
          type: [string, 'null']
        country:
          type: [string, 'null']
          description: ISO 3166-1 alpha-2 country code.
          pattern: '^[A-Z]{2}$'

    Contact:
      type: object
      properties:
        phone:
          type: [string, 'null']
        mobile:
          type: [string, 'null']
        email:
          type: [string, 'null']
          format: email

    HarvestPeriod:
      type: object
      description: >
        Canonical harvest period as an interval. A discrete year is mapped to an
        interval on send; `label` may round-trip the native presentation.
      properties:
        valid_from:
          type: string
          format: date
        valid_to:
          type: [string, 'null']
          format: date
          description: Absent means open / current.
        label:
          type: [string, 'null']
          description: 'Human-facing designation, e.g. "2026" or "2025/2026".'
      required: [valid_from]

    Party:
      description: >
        A legal or natural actor: a person, an organization, or a party whose
        party type its sender does not record. It plays no fixed role: whether it acts
        as a contractor or as a client follows from the relations it stands in,
        not from an attribute.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: party
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
                If sent, it must match the path.
            name:
              type: string
              description: >
                The name the party is known by: an organization's name, a
                person's full name.
            details:
              oneOf:
                - $ref: '#/components/schemas/PartyDetails'
                - type: 'null'
              description: >
                Whether the party is a person or an organization, with the
                attributes specific to that party type. Absent means the party
                type is unknown. Whatever a write sends here is stated to every
                participant.
            address:
              oneOf:
                - $ref: '#/components/schemas/Address'
                - type: 'null'
            contact:
              oneOf:
                - $ref: '#/components/schemas/Contact'
                - type: 'null'
            billing_address:
              oneOf:
                - $ref: '#/components/schemas/Address'
                - type: 'null'
            tax_number:
              type: [string, 'null']
              description: Identifier assigned by tax authorities.
            tax_id:
              type: [string, 'null']
              description: Numerical identifier assigned by tax authorities.
            trade_id:
              type: [string, 'null']
              description: Numerical identifier assigned by public authorities.
          required: [type, name]

    PartyDetails:
      description: >
        The type of a party. `party_type` is a closed set, since it selects the
        schema of the remaining attributes, and each type admits only its own
        attributes.
      oneOf:
        - $ref: '#/components/schemas/PersonDetails'
        - $ref: '#/components/schemas/OrganizationDetails'
      discriminator:
        propertyName: party_type
        mapping:
          PERSON: '#/components/schemas/PersonDetails'
          ORGANIZATION: '#/components/schemas/OrganizationDetails'

    PersonDetails:
      type: object
      description: >
        A natural person. A person may belong to one or more organizations
        through `memberships`.
      properties:
        party_type:
          const: PERSON
        title:
          type: [string, 'null']
        first_name:
          type: [string, 'null']
        last_name:
          type: [string, 'null']
        memberships:
          type: [array, 'null']
          description: >
            The organizations this person belongs to, each with the role held
            there. A person carrying at least one entry is a member.
          items:
            $ref: '#/components/schemas/Membership'
      required: [party_type]

    OrganizationDetails:
      type: object
      description: A legal entity to which persons may belong.
      properties:
        party_type:
          const: ORGANIZATION
        commercial_registry_number:
          type: [string, 'null']
          description: Identifier from the commercial register.
      required: [party_type]

    Membership:
      type: object
      description: A role held by a person in one organization.
      properties:
        organization_id:
          $ref: '#/components/schemas/EntityReference'
          description: >
            The organization the person belongs to: a party whose `details` is
            an organization. A write naming any other party is a `400`, and so
            is a change or removal of party type on an organization that
            persons still name.
        member_role:
          $ref: '#/components/schemas/Role'
      required: [organization_id, member_role]

    Partner:
      type: object
      description: >
        A party holding a role on a farm — the contractor that works it, the
        advisor that reads it. Records a business relationship only. It does NOT
        grant visibility of the farm: what an endpoint receives is decided by
        opt-in and routing.
      properties:
        partner_id:
          $ref: '#/components/schemas/EntityReference'
          description: The party acting as partner.
        partner_role:
          $ref: '#/components/schemas/Role'
      required: [partner_id, partner_role]

    Role:
      type: string
      description: >
        [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
        A role drawn from the ADAPT Role data type.
      examples:
        - UNKNOWN
        - AUTHORIZER
        - CROP_ADVISOR
        - CUSTOMER
        - CUSTOM_SERVICE_PROVIDER
        - DATA_SERVICES_PROVIDER
        - END_USER
        - FARM_MANAGER
        - FINANCIER
        - STATIONARY_ASSET_SUPPLIER
        - GOVERNMENT_AGENCY
        - GROWER
        - INPUT_SUPPLIER
        - INSURANCE_AGENT
        - IRRIGATION_MANAGER
        - LABORER
        - MARKET_ADVISOR
        - MARKET_PROVIDER
        - MOBILE_ASSET_SUPPLIER
        - OPERATOR
        - OWNER
        - TRANSPORTER
        - COLLECTOR

    Farm:
      description: >
        A grouping of fields that the farmer considers part of the same
        management group.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: farm
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
                If sent, it must match the path.
            owner:
              oneOf:
                - $ref: '#/components/schemas/EntityReference'
                - type: 'null'
              description: >
                The party that holds the farm. Absent where the farm's system
                does not record parties.
            name:
              type: string
            specialised_usage_type:
              type: [string, 'null']
              description: >
                Production orientation of the farm (e.g. arable farming, dairy,
                vineyard, orchard). Free-form, drawn from AGROVOC where a
                matching concept exists.
            partners:
              type: [array, 'null']
              description: >
                Parties holding a role on this farm, such as the contractor that
                works it or the advisor that reads it.
              items:
                $ref: '#/components/schemas/Partner'
            address:
              oneOf:
                - $ref: '#/components/schemas/Address'
                - type: 'null'
            geo_reference:
              oneOf:
                - $ref: '#/components/schemas/Geometry'
                - type: 'null'
              description: A GeoJSON Point (longitude, latitude) locating the farm.
          required: [type, name]

    SoilInfo:
      type: object
      description: Soil characteristics of a field.
      properties:
        type:
          type: [string, 'null']
          description: >
            [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
            The soil classification.
          examples:
            - SAND
            - LOAMY_SAND
            - HEAVY_LOAMY_SAND
            - SANDY_TO_SILTY_LOAM
            - CLAYEY_LOAM
            - CLAY
        rating_points:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: >
            Soil rating points (Bodenzahl / Ackerzahl). Germany only, as defined
            by the [Bodenschätzungsgesetz](https://www.bundesfinanzministerium.de/Content/DE/Standardartikel/Themen/Steuern/Weitere_Steuerthemen/2014-07-21-bodenschaetzung-anlage-VRBodSchaetzG.pdf?__blob=publicationFile&v=1).

    Field:
      description: >
        A named physical space where production agriculture takes place, used
        to partition and identify data.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: field
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
                If sent, it must match the path.
            name:
              type: string
            area:
              type: [number, 'null']
              description: Nominal area in square metres.
            farm:
              oneOf:
                - $ref: '#/components/schemas/EntityReference'
                - type: 'null'
              description: The farm this field belongs to.
            owner:
              oneOf:
                - $ref: '#/components/schemas/EntityReference'
                - type: 'null'
              description: >
                The party holding this field, for systems that
                attribute fields to a party directly. When absent, the field is
                held by its farm's owner. When present, it takes precedence for
                this field, which is how a field held by one party but managed
                under another's farm is expressed.
            soil:
              oneOf:
                - $ref: '#/components/schemas/SoilInfo'
                - type: 'null'
            topography:
              type: [number, 'null']
              description: 'Slope / gradient, e.g. 7 (degrees).'
            harvest_period:
              oneOf:
                - $ref: '#/components/schemas/HarvestPeriod'
                - type: 'null'
            metadata:
              type: [object, 'null']
              description: >
                Additional key/value metadata. A participant leaves the keys it
                does not understand out of its writes, which keeps them.
              additionalProperties: true
          required: [type, name]

    Obstacle:
      type: object
      description: >
        A GeoJSON Feature describing an in-field obstacle whose geometry is a
        Point, LineString, or Polygon.
      properties:
        type:
          const: Feature
        geometry:
          $ref: '#/components/schemas/Geometry'
        properties:
          type: object
          properties:
            kind:
              type: string
              description: 'Obstacle kind, e.g. "pole", "tree", "waterhole".'
          required: [kind]
      required: [type, geometry, properties]

    FieldBoundary:
      description: >
        A geometry identifying the geo-spatial coordinates of a field, including
        its outer boundary and any obstacles left out. A field may have several
        boundaries that differ in geometry by intended use.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: fieldBoundary
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
                If sent, it must match the path.
            field:
              $ref: '#/components/schemas/EntityReference'
              description: >
                The field this boundary describes. A field's boundaries are the
                boundaries that name it.
            name:
              type: [string, 'null']
              description: >
                The name the boundary is known by, e.g. a field name and season.
            boundary:
              $ref: '#/components/schemas/Geometry'
              description: A GeoJSON Polygon or MultiPolygon.
            boundary_type:
              type: [string, 'null']
              description: >
                [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
                The boundary classification.
              examples:
                - CONCEPTUAL
                - OPERATIONAL
                - ECONOMIC_DEFINED
                - ADMINISTRATIVE_RECEIVED
            creation_method:
              type: [string, 'null']
              description: >
                [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
                How the boundary was produced.
              examples:
                - UNKNOWN
                - MANUAL
                - DRIVEN
                - SURVEYED
                - AUTO_OPERATION
                - AUTO_IMAGERY
                - ADMINISTRATIVE
            harvest_period:
              oneOf:
                - $ref: '#/components/schemas/HarvestPeriod'
                - type: 'null'
            obstacles:
              type: [array, 'null']
              items:
                $ref: '#/components/schemas/Obstacle'
            regulatory_requirements:
              type: [string, 'null']
              description: >
                [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
                A regulatory constraint applying to the boundary.
              examples:
                - RED_ZONE_NITROGEN
                - WATER_PROTECTION_AREA
            metadata:
              type: [object, 'null']
              description: >
                Additional key/value metadata. A participant leaves the keys it
                does not understand out of its writes, which keeps them.
              additionalProperties: true
          required: [type, field, boundary]

    Entity:
      description: >
        Any master-data entity. Used only on the event stream, which carries every
        opted-in entity type over a single connection; the typed resources use the
        concrete schemas directly.
      oneOf:
        - $ref: '#/components/schemas/Party'
        - $ref: '#/components/schemas/Farm'
        - $ref: '#/components/schemas/Field'
        - $ref: '#/components/schemas/FieldBoundary'
      discriminator:
        propertyName: type
        mapping:
          party: '#/components/schemas/Party'
          farm: '#/components/schemas/Farm'
          field: '#/components/schemas/Field'
          fieldBoundary: '#/components/schemas/FieldBoundary'

    Geometry:
      type: object
      description: >
        A GeoJSON geometry (RFC 7946). Positions are [longitude, latitude] and,
        optionally, altitude.
      properties:
        type:
          type: string
          description: >
            [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
            The GeoJSON geometry type.
          examples: [Point, LineString, Polygon, MultiPolygon]
        coordinates:
          description: Nesting depth depends on `type`.
      required: [type, coordinates]

    EntityTypeToggle:
      type: object
      properties:
        entity_type:
          type: string
          description: >
            [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
            The entity type this toggle applies to.
          examples: [party, farm, field, fieldBoundary]
      required: [entity_type]

    MasterdataConfig:
      type: object
      description: >
        Per-endpoint, per-entity opt-in for master-data exchange. Absence of a
        toggle for an entity type means the endpoint is not opted in for it.
      properties:
        endpoint_id:
          type: string
          format: uuid
          readOnly: true
          description: >
            The agrirouter identifier of the endpoint this resource belongs to.
            The path addresses it by the participant's own `external_id`.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/EntityTypeToggle'
        resolution_url:
          type: string
          format: uri
          description: >
            Where the user resolves initial-load conflicts in the endpoint's own
            software. Optional, opaque to agrirouter, and not per conflict: it is
            rendered as a link while the endpoint has `awaiting_user` set.
          examples: ['https://app.example.com/tenants/42/agrirouter/masterdata']
      required: [capabilities]

    RouteChangedEventData:
      type: object
      description: >
        Data structure for `ROUTE_CHANGED` events on
        `/masterdata/events`. It states which entity types the user has selected
        for one of the application's endpoints.

        One event covers every way the selection changes: the endpoint given a
        masterdata route for the first time, a further entity type selected on
        one already routed, a type deselected, and the last one deselected or the
        route removed.

        The event may arrive more than once for one move and MUST be handled idempotently.
      required: [event_type, endpoint_id, external_id, entity_types, changed_at]
      properties:
        event_type:
          type: string
          const: ROUTE_CHANGED
          description: Discriminator; matches the `event:` line.
        endpoint_id:
          type: string
          format: uuid
          description: The agrirouter identifier of the endpoint whose selection changed.
        external_id:
          type: string
          description: The application's own identifier for the same endpoint.
        entity_types:
          type: array
          items:
            $ref: '#/components/schemas/EntityTypeToggle'
          description: >
            The endpoint's selection as it stands after the change, stated in
            full rather than as a delta.

            An empty array is a statement and not an omission: it says the
            endpoint exchanges nothing, because the user deselected the last
            entity type or the route was removed.
          examples:
            - [{entity_type: party}, {entity_type: farm}]
        changed_at:
          type: string
          format: date-time
          description: >
            When the selection reached this state. Not a delivery timestamp: it
            is unchanged when the same event is delivered again, and a repeat
            carrying an older value than one already applied for this endpoint
            can be discarded.
          examples: ['2026-07-14T09:20:00Z']

    MasterdataResetEventData:
      type: object
      description: >
        Data structure for `RESET_MASTERDATA_SYNC` events on
        `/masterdata/events`. It states that the user wiped the tenant's master
        data in agrirouter: every canonical object, every identifier mapping,
        every masterdata route and every initial-load state of the tenant is
        discarded. Only a user can do this; no operation of this API does.


        Sent to every application that holds a binding in the tenant or has an
        endpoint there that has taken part at some point. The application MUST discard every binding and stored revision it holds
        in the tenant, and treat the listed endpoints as opted into nothing. It
        MUST NOT delete or deactivate its local records. No `ROUTE_CHANGED` is
        issued for the listed endpoints.


        agrirouter delivers it before any later event of the tenant. The
        application MUST durably store a position at or past it before taking
        part in that tenant's initial load again, so that a repeat can only
        arrive while nothing is bound and handling it again changes nothing.
      required: [event_type, tenant_id, endpoints]
      properties:
        event_type:
          type: string
          const: RESET_MASTERDATA_SYNC
          description: Discriminator; matches the `event:` line.
        tenant_id:
          type: string
          format: uuid
          description: The tenant whose master data was wiped.
        endpoints:
          type: array
          description: >
            The application's endpoints in the tenant, each now opted into
            nothing. Empty where the application has no endpoint left there and
            is told only because it held bindings.
          items:
            type: object
            required: [endpoint_id, external_id]
            properties:
              endpoint_id:
                type: string
                format: uuid
                description: The agrirouter identifier of the endpoint.
              external_id:
                type: string
                description: The application's own identifier for the same endpoint.

    InitialLoadState:
      type: string
      description: >
        Per-endpoint initial-load state, covering every entity type the
        endpoint is opted into.


        `LOADING_FROM_AGRIROUTER` — agrirouter is still sending the canonical set.
        Entered when the user selects the endpoint's first entity type, and again
        whenever a further entity type is selected. Both are a user's opt-in
        decision carried out by agrirouter, and the application is told of them
        by `ROUTE_CHANGED` on `/masterdata/events`. A participant cannot
        enter this state directly — neither by adding a type to its declaration,
        which enables nothing, nor by setting it on the `status` resource, which
        is a `409`.


        `RECONCILING` — the whole canonical set has been delivered, and
        agrirouter moves the endpoint here before closing the initial-load
        stream. agrirouter moves it here itself, and only this one,
        because it is the side that knows it has finished sending, which is also
        why this state is the authoritative answer to whether the set arrived: an
        endpoint cannot tell an orderly close from a dropped connection. Moving
        first is what makes reading it once, as the response ends, enough. The
        endpoint is now working through whatever conflicts reconciling surfaced,
        which may take as long as a user takes.


        `LOADING_TO_AGRIROUTER` — the endpoint has confirmed it reconciled, and is
        sending the objects it holds that the canonical set did not contain.


        `COMPLETED` — steady-state synchronization applies.


        The endpoint drives two of these transitions, both through the
        `status` resource: `RECONCILING` → `LOADING_TO_AGRIROUTER` and
        `LOADING_TO_AGRIROUTER` → `COMPLETED`.
      enum:
        - LOADING_FROM_AGRIROUTER
        - RECONCILING
        - LOADING_TO_AGRIROUTER
        - COMPLETED

    InitialLoadStatus:
      type: object
      description: >
        The endpoint's initial-load state. One per endpoint, covering every
        entity type it is opted into; an endpoint opted into no entity type has
        no initial-load state.
      properties:
        endpoint_id:
          type: string
          format: uuid
          readOnly: true
          description: >
            The agrirouter identifier of the endpoint this resource belongs to.
            The path addresses it by the participant's own `external_id`.
        state:
          $ref: '#/components/schemas/InitialLoadState'
        awaiting_user:
          type: boolean
          readOnly: true
          description: >
            Whether the endpoint's own software is needing user action
            — a conflict, a missing required
            attribute, a granularity mismatch. Raised by the endpoint through the
            `user-attention` resource and cleared by agrirouter, on the two
            endpoint-driven transitions only: advancing
            to `LOADING_TO_AGRIROUTER` clears it, and so does advancing to
            `COMPLETED`. The step to `RECONCILING` does not, since that is
            agrirouter reporting it has finished sending and says nothing about
            whether the user has finished deciding. agrirouter renders the flag as
            "waiting for you in <app>", linking to the master-data resolution URI
            supplied for this endpoint.
        previous_load_completed_at:
          type: string
          format: date-time
          readOnly: true
          description: >
            When this endpoint last reached `COMPLETED`, present only if it
            has. Its presence means the canonical set now arriving is a repeat
            load — the endpoint was a participant before and has returned, having
            been deselected, had its masterdata route removed, or had a further
            entity type selected on it. Each of those is the user's act: an
            application cannot ask for the set again. The identifier mapping
            survived all of them, so the objects
            arrive carrying the endpoint's own `local_id` and match rather than
            reconcile. An endpoint MUST NOT take the arrival of a canonical set as
            evidence of a first connection: without this check it creates local
            duplicates of data it already holds.
        rejected_id_mappings:
          type: array
          readOnly: true
          description: >
            Bindings supplied on this request that could not be recorded, each
            with its `reason` and, where one exists, the mapping that stands in
            its way. They do not fail the transition: one unresolvable pair
            should not block the load of a set. The endpoint resolves them as it
            resolves a `409` on the per-entity operation, and rebinds through
            that operation once it has. Recomputed on every request that carries
            `id_mappings`, including a repeat of the transition, so a retry after
            a lost response reports the current outcome rather than the first.
          items:
            $ref: '#/components/schemas/IdMappingRejection'
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required: [state]

    InitialLoadStateUpdate:
      type: object
      description: >
        The target initial-load `state` for the endpoint. The states are
        accepted in order, and repeating the one the endpoint is already in is
        accepted too. `LOADING_FROM_AGRIROUTER` is never a transition an
        endpoint may make, from any state including from itself.
      properties:
        state:
          $ref: '#/components/schemas/InitialLoadState'
        id_mappings:
          type: array
          description: >
            The bindings reconciliation produced: one entry per canonical object
            the endpoint matched to something it already held. Carried here
            because matching happens over a whole set, and the semantics are those
            of the per-entity `id-mapping` operation applied to each pair. Meaningful
            only on the transition to `LOADING_TO_AGRIROUTER`, which is where
            reconciliation is asserted to be done, and on a repeat of that
            transition, where the pairs are applied again and the rejections
            recomputed. Pairs are applied
            independently: any that cannot be recorded — because an identifier is
            already bound, because the canonical object is unknown to the
            endpoint, or because the request names the same identifier twice —
            come back in `rejected_id_mappings` rather than failing the transition.
          items:
            $ref: '#/components/schemas/IdMappingBinding'
      required: [state]
