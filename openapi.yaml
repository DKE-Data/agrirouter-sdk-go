      operationId: getInitialLoadStatus
      tags: [Masterdata]
      summary: Get the endpoint's initial load status
      description: >
        Returns the endpoint's initial-load state, covering every entity
        type it is opted into. An endpoint opted into no entity type has
        none.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
