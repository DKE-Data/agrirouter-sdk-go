      description: >
        Streams every object of every opted-in entity type this endpoint is
        entitled to, while the endpoint is loading from agrirouter.
        agrirouter closes the response once the whole set has been sent, and
        a dropped connection is recovered by requesting the set again from
        the beginning.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
