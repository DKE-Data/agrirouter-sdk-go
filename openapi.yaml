        updates it instead of creating a duplicate.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      responses:
        '204':
          description: The mapping is recorded.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MappingConflict'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error
    delete:
      operationId: unbindPersonMapping
      tags: [Masterdata]
      summary: Declare that this endpoint no longer holds a person
      description: >
        Declares that the endpoint no longer holds the canonical person
        under this local_id. The canonical object itself is untouched and is
        delivered again, without a local_id, on its next change.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      responses:
        '204':
          description: >
            The endpoint holds no mapping for this pair. Returned whether or
            not one existed, so a retry after a lost response is safe.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error

  /masterdata/persons/{local_id}/deactivation:
    post:
