          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InitialLoadConflict'
        '502':
          description: Bad Gateway, upstream service has returned an error
        '503':
          description: Service Unavailable at the moment
        '504':
          description: Gateway Timeout, request took too long to process
        '500':
          description: Server Side Error

  /endpoints/{external_id}/masterdata-initial-load/user-attention:
    parameters:
      - $ref: '#/components/parameters/ExternalEndpointId'
      - $ref: '#/components/parameters/x-agrirouter-tenant-id'
    put:
      operationId: reportUserAttention
      tags: [Masterdata]
      summary: Report that the endpoint's initial load is waiting on a user
      description: >
        Raises awaiting_user on the endpoint's initial-load status, so that
        agrirouter tells the user the load is waiting for them in the
        application, linking to the endpoint's resolution URL. It carries no
        body and names no state, so it may be sent from any state before
        COMPLETED; agrirouter clears the flag when the endpoint advances to
        LOADING_TO_AGRIROUTER or COMPLETED. Repeating it is a 200.
      security:
        - agrirouterOauthQA: ["endpoints:manage"]
        - agrirouterOauthPROD: ["endpoints:manage"]
      responses:
        '200':
          description: The endpoint's initial load status, with the flag raised.
